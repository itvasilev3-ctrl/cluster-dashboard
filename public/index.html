<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRUM Cluster</title>
<style>
  :root {
    --bg:#f5f6f8; --panel:#fff; --line:#e1e4ea; --text:#1b2030; --muted:#697086;
    --accent:#2b6cff; --ok:#1f9d63; --warn:#c98a00; --bad:#d33b3b;
    --c0:#eef1f6; --c1:#cfe0ff; --c2:#8db4ff; --c3:#4a85ff; --c4:#1d4fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1219; --panel:#171b25; --line:#272d3b; --text:#e6e9f2; --muted:#8a92a8;
      --accent:#6c9bff; --ok:#3ccf8e; --warn:#e8b339; --bad:#ff6b6b;
      --c0:#1d2230; --c1:#22407a; --c2:#2f62c9; --c3:#4f8bff; --c4:#8fb5ff;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,Segoe UI,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:17px; margin:0; font-weight:650; }
  .muted { color:var(--muted); }
  .pill { padding:2px 9px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); } .pill.warn { color:var(--warn); } .pill.bad { color:var(--bad); }
  main { padding:16px 20px 40px; display:grid; gap:16px; max-width:1500px; margin:auto; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  .panel h2 { margin:0 0 10px; font-size:13px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .tile .v { font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; }
  .tile .s { font-size:12px; color:var(--muted); }
  .bar { height:6px; background:var(--c0); border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .two { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:16px; }
  @media (max-width:900px) { .two { grid-template-columns:1fr; } }
  .cores { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; }
  .core { border-radius:5px; padding:5px 0; text-align:center; font-size:11px; font-variant-numeric:tabular-nums; background:var(--c0); position:relative; }
  .core b { display:block; font-size:13px; }
  .core.hot { color:#fff; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; user-select:none; }
  td.cmd { white-space:normal; word-break:break-all; max-width:420px; color:var(--muted); font-size:12px; }
  td.n, th.n { text-align:right; }
  .scroll { overflow:auto; max-height:420px; }
  .user { font-weight:600; }
  .gpu-off { color:var(--bad); }
  label { font-size:12px; color:var(--muted); margin-left:12px; }
  svg.spark { width:100%; height:56px; display:block; }
  .legend { font-size:12px; color:var(--muted); display:flex; gap:14px; margin-top:6px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .stack { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--c0); margin-top:8px; }
  .stack i { display:block; height:100%; }
  .click { cursor:pointer; }
  .click:hover, .click:focus-visible { border-color:var(--accent); outline:none; }
  .modal-bg { position:fixed; inset:0; background:rgba(10,14,22,.55); display:flex; align-items:flex-start; justify-content:center; padding:4vh 16px; z-index:10; overflow:auto; }
  .modal-bg[hidden] { display:none; }
  .modal { width:min(1100px,100%); }
  .modal-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px; }
  .modal-head h2 { margin:0; font-size:15px; text-transform:none; letter-spacing:0; color:var(--text); }
  .modal h3 { margin:18px 0 6px; font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .modal p { margin:6px 0; }
  .modal pre { background:var(--c0); padding:10px 12px; border-radius:8px; white-space:pre-wrap; word-break:break-all; font-size:12px; margin:6px 0; user-select:all; }
  .modal tr.total td { font-weight:650; border-top:2px solid var(--line); }
  .modal .warn { color:var(--bad); font-weight:600; }
  button.pill { background:none; color:var(--text); cursor:pointer; font:inherit; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>ASTRUM Cluster</h1>
  <span id="host" class="muted"></span>
  <span id="fresh" class="pill">no data</span>
  <span id="clusterFresh" class="muted"></span>
  <button id="refreshNow" class="pill" type="button" title="Collect fresh data from the cluster now">Refresh now</button>
  <span id="feedInfo" class="muted"></span>
</header>
<main>
  <section class="tiles" id="tiles"></section>

  <section class="panel">
    <h2>Tasks in progress <span id="tasksNote" class="muted" style="text-transform:none;letter-spacing:0"></span></h2>
    <div class="scroll"><table id="tasks"></table></div>
  </section>

  <section class="two">
    <div class="panel click" data-detail="cores" role="button" tabindex="0" title="Click to see what runs on each core">
      <h2>CPU cores <span id="coreNote" class="muted" style="text-transform:none;letter-spacing:0"></span></h2>
      <div id="coreSlots" class="muted" style="margin:0 0 8px;font-size:12px"></div>
      <div class="cores" id="cores"></div>
      <svg class="spark" id="spark" viewBox="0 0 300 56" preserveAspectRatio="none"></svg>
      <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>CPU avg %</span><span><i class="dot" style="background:var(--ok)"></i>GPU %</span></div>
    </div>
    <div class="panel">
      <h2>GPU</h2>
      <div id="gpu"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Disk space <span id="diskNote" class="muted" style="text-transform:none;letter-spacing:0"></span></h2>
    <div class="scroll"><table id="disks"></table></div>
  </section>

  <section class="two">
    <div class="panel">
      <h2>Cluster jobs (by user)</h2>
      <div class="scroll"><table id="jobs"></table></div>
    </div>
    <div class="panel">
      <h2>Usage per user</h2>
      <div class="scroll"><table id="users"></table></div>
    </div>
  </section>

  <section class="panel">
    <h2>Processes
      <label><input type="checkbox" id="hideIdle" checked> hide idle (&lt;0.5% CPU)</label>
      <label><input type="checkbox" id="hideKernel" checked> hide kernel threads</label>
    </h2>
    <div class="scroll"><table id="procs"></table></div>
  </section>
</main>

<div id="modalBg" class="modal-bg" hidden>
  <div class="panel modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="pill" type="button">Close ✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtAge = (s) => s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s/60)}m` : s < 172800 ? `${(s/3600).toFixed(1)}h` : `${Math.round(s/86400)}d`;
const fmtDur = (s) => { s = Math.round(s); const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return d?`${d}d ${h}h`:h?`${h}h ${m}m`:m?`${m}m ${s%60}s`:`${s}s`; };
let sortKey = "cpu", sortDir = -1;

function tile(label, value, sub, pct, detail) {          // detail = which breakdown opens when the tile is clicked
  return `<div class="panel tile${detail ? " click" : ""}"${detail ? ` data-detail="${detail}" role="button" tabindex="0" title="Click to see everything that uses this"` : ""}><div class="s">${label}</div><div class="v">${value}</div><div class="s">${sub || ""}</div>` +
    (pct != null ? `<div class="bar"><i style="width:${Math.min(100, pct)}%"></i></div>` : "") + `</div>`;
}
// The host's memory split three ways, so it adds up to what is installed: free (what the kernel can hand out), jobs (resident memory of every
// process that belongs to a scheduler job), and the system (everything else: the part firmware and kernel take at boot, so the OS never sees it,
// plus the OS, services and caches). The OS reports less than is installed (30 of 32 GB here), so the feeder passes the installed size.
// A job's processes that share pages are each counted in full, so the jobs figure is capped at what is actually in use.
function memBreakdown(h, ownerOf) {
  const total = Math.max(h.mem_installed_mb || 0, h.mem_total_mb), used = h.mem_total_mb - h.mem_available_mb;
  const jobsRaw = (h.procs || []).reduce((s, p) => s + (ownerOf(p) ? p.rss_mb : 0), 0), jobs = Math.min(jobsRaw, used);
  const hw = total - h.mem_total_mb, os = used - jobs;
  return { total, free: h.mem_available_mb, jobs, hw, os, sys: hw + os, overcounted: jobsRaw > used };
}
function heat(p) { return p < 5 ? "var(--c0)" : p < 25 ? "var(--c1)" : p < 50 ? "var(--c2)" : p < 80 ? "var(--c3)" : "var(--c4)"; }

function renderFeed(now, feed) {
  const el = $("feedInfo");
  if (!feed) { el.textContent = ""; return; }
  const parts = [];
  if (feed.running) parts.push("refreshing now…");
  else if (feed.last_end) parts.push(`last refresh ${fmtAge(now - feed.last_end)} ago${feed.last_code ? " (failed, code " + feed.last_code + ")" : ""}`);
  if (feed.next_due) parts.push(`next in ${fmtAge(Math.max(0, feed.next_due - now))}`);
  el.textContent = parts.join(" · ");
}

function render({ now, snap, history, feed }) {
  renderFeed(now, feed);
  const h = snap.host, jobs = Array.isArray(snap.jobs) ? snap.jobs : [];
  const cl = snap.cluster && typeof snap.cluster.cpu_slots === "number" ? snap.cluster : null;   // an error message stored as "cluster" must not draw tiles
  const running = jobs.filter((j) => j.status === "running");
  const queued = jobs.filter((j) => j.status === "queued" || j.status === "pending");
  // the GPU slot: a job can hold it while the GPU sits idle (e.g. during a CPU phase), so this is separate from "processes using the GPU"
  const gpuHolders = running.filter((j) => j.gpu_slots > 0), gpuWaiting = queued.filter((j) => j.gpu_slots > 0);
  const heldBy = Object.entries((snap.cluster && snap.cluster.per_client_running) || {}).filter(([, v]) => v.gpu_slots > 0).map(([u]) => u);

  // freshness
  const age = h ? now - (snap.host_ts || h.ts) : null;
  const f = $("fresh");
  if (age == null) { f.textContent = "no host data"; f.className = "pill bad"; }
  else { f.textContent = `host data ${fmtAge(age)} old`; f.className = "pill " + (age < 420 ? "ok" : age < 900 ? "warn" : "bad"); }
  $("host").textContent = h ? h.hostname : "";
  $("clusterFresh").textContent = snap.cluster_ts ? `scheduler data ${fmtAge(now - snap.cluster_ts)} old` : "";

  // map pid -> owning job (walk ppid chain), so service-account processes get a real user
  const jobByPid = new Map(jobs.filter((j) => j.pid).map((j) => [j.pid, j]));
  const byPid = new Map(((h && h.procs) || []).map((p) => [p.pid, p]));
  const ownerOf = (p) => {
    for (let q = p, i = 0; q && i < 12; q = byPid.get(q.ppid), i++) {
      const j = jobByPid.get(q.pid);
      if (j) return j;
    }
    return null;
  };

  // tasks (from the feeder, every 5 min)
  const tasks = snap.tasks || [];
  $("tasksNote").textContent = snap.tasks_ts ? `· updated ${fmtAge(now - snap.tasks_ts)} ago, every 5 min` : "· no task data yet";
  const pctCell = (p) => p == null ? '<span class="muted">n/a</span>' : `<b>${p.toFixed(p < 10 ? 1 : 0)}%</b><div class="bar" style="width:140px"><i style="width:${Math.min(100, p)}%"></i></div>`;
  $("tasks").innerHTML = `<tr><th>task</th><th>kind</th><th>status</th><th>done</th><th>uses (CPU / GPU)</th><th>detail</th><th class="n">ETA</th></tr>` +
    (tasks.map((k) => `<tr${k.level ? ' style="opacity:.85"' : ""}><td class="user" style="white-space:normal;padding-left:${8 + 16 * (k.level || 0)}px">${esc(k.name)}</td><td class="muted">${esc(k.kind || "")}</td><td>${esc(k.status || "")}</td><td>${pctCell(k.pct)}</td><td class="cmd" style="color:var(--text)">${esc(k.uses || "")}</td><td class="cmd">${esc(k.detail || "")}</td><td class="n">${k.eta_s != null ? fmtDur(k.eta_s) : ""}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">nothing running</td></tr>`);

  // tiles
  const t = [];
  const workNow = h ? h.cores.reduce((s, c) => s + c.busy, 0) / 100 : null;   // cores of work really happening, from the per-core load
  if (cl) {
    // a slot is a reservation, not CPU use: say how much of it is really busy
    t.push(tile("CPU slots reserved", `${cl.used_cpu_slots}/${cl.cpu_slots}`, workNow != null ? `<b>${workNow.toFixed(1)} cores actually busy</b> · ${cl.available_cpu_slots} slots free` : `${cl.available_cpu_slots} free`,
      100 * cl.used_cpu_slots / cl.cpu_slots, "cpu"));
    const holders = gpuHolders.length ? [...new Set(gpuHolders.map((j) => `${j.client_id} · ${j.project}`))] : heldBy;
    t.push(tile("GPU slots", `${cl.used_gpu_slots}/${cl.gpu_slots}`,
      (cl.used_gpu_slots ? `held by ${esc(holders.join(", ") || "a job")}` : "free") + (h && h.gpu && h.gpu.ok && h.gpu.devices[0] ? ` · <b>GPU ${h.gpu.devices[0].util}% busy</b>` : "") + (gpuWaiting.length ? ` · ${gpuWaiting.length} waiting` : ""),
      100 * cl.used_gpu_slots / Math.max(1, cl.gpu_slots), "gpu"));
    const unlisted = cl.running_jobs - running.length;        // the scheduler counts more running jobs than it lists (it lists only the latest 200)
    t.push(tile("Jobs", `${cl.running_jobs} running`, `${cl.queued_jobs} queued` + (unlisted > 0 ? ` · <b style="color:var(--bad)">${unlisted} running not in the list</b>` : "")));
  }
  if (h) {
    const avg = h.cores.reduce((s, c) => s + c.busy, 0) / h.cores.length;
    t.push(tile("Actual CPU load", `${avg.toFixed(0)}%`, `load avg ${h.load.join(" / ")}`, avg, "cpu"));
    const ct = h.cpu_temp;                                   // from the status service; absent while an older service is running
    if (ct) t.push(tile("CPU temperature", `${ct.temp_c.toFixed(0)} °C`, ct.sensors.filter((s) => s !== ct && s.label !== ct.label).map((s) => `${s.label} ${s.temp_c.toFixed(0)}°`).join(" · ") || ct.label, ct.temp_c));
    const cp = h.cpu_power;                                   // watts from the CPU package energy counter; null with a reason while it is root-only
    if (cp) t.push(cp.watts != null
      ? tile("CPU power", `${cp.watts.toFixed(0)} W`, "whole CPU package, ~1.5 s average" + (cp.persistent === false ? ` · <b style="color:var(--bad)">will be lost at the next reboot</b>, click to fix` : ""), null, "power")
      : tile("CPU power", "unavailable", "the CPU's energy counter is root-only · <b>click for the one-time fix</b>", null, "power"));
    // memory of the whole host split three ways: the system (OS, services, kernel, caches), the jobs, and what is free
    const m = memBreakdown(h, ownerOf), seg = (mb, color) => `<i style="width:${100 * mb / m.total}%;background:${color}"></i>`;
    const dot = (color) => `<i class="dot" style="background:${color}"></i>`;
    t.push(`<div class="panel tile click" data-detail="memory" role="button" tabindex="0" title="Click to see everything that uses the memory" style="grid-column:span 2">` +
      `<div class="s">Memory · ${(m.total / 1024).toFixed(1)} GB</div><div class="v">${(m.free / 1024).toFixed(1)} GB free</div>` +
      `<div class="s">${dot("var(--muted)")}System &amp; other ${(m.sys / 1024).toFixed(1)} GB · ${dot("var(--accent)")}Jobs ${(m.jobs / 1024).toFixed(1)} GB · ${dot("var(--c1)")}Free ${(m.free / 1024).toFixed(1)} GB</div>` +
      `<div class="stack">${seg(m.sys, "var(--muted)")}${seg(m.jobs, "var(--accent)")}${seg(m.free, "var(--c1)")}</div></div>`);
  }
  $("tiles").innerHTML = t.join("");

  // cores
  if (h) {
    const n = h.cores.length;
    $("cores").style.gridTemplateColumns = `repeat(${n > 16 ? 8 : 4}, 1fr)`;
    // who runs on each core: the threads the status service saw using at least 2% of a core in its 1 s sample, mapped to their job
    onCore = {};
    for (const [pid, core, pct] of h.threads || []) {
      const p = byPid.get(pid), o = p && ownerOf(p);
      (onCore[core] ||= []).push({ pid, pct, who: o ? `${o.client_id} · ${o.project}` : p ? `${p.user} (no job)` : "?", cmd: p ? p.cmd : "" });
    }
    $("cores").innerHTML = h.cores.map((c) => { const on = (onCore[c.id] || []).sort((a, b) => b.pct - a.pct).map((t) => `${t.who}, pid ${t.pid}, ${t.pct.toFixed(0)}%`).join("\n");
      return `<div class="core ${c.busy >= 50 ? "hot" : ""}" style="background:${heat(c.busy)}" title="core ${c.id}: user ${c.user}% · nice ${c.nice}% · sys ${c.sys}% · iowait ${c.iowait}%${on ? "\n" + esc(on) : ""}">${c.id}<b>${Math.round(c.busy)}%</b></div>`; }).join("");
    const busy = h.cores.filter((c) => c.busy >= 50).length, work = h.cores.reduce((s, c) => s + c.busy, 0) / 100;
    $("coreNote").textContent = `· ${busy} of ${n} cores above 50% · load = ${work.toFixed(1)} cores of work (${(100 * work / n).toFixed(0)}%)`;
    $("coreSlots").innerHTML = cl ? `Jobs have <b>reserved ${cl.used_cpu_slots} of ${cl.cpu_slots} CPU slots</b>, but only <b>${work.toFixed(1)} cores</b> are busy: a slot is a reservation, not CPU use. ` +
      `Click the CPU slots tile for each job's reservation against its real use.` : "";
  }

  // sparkline
  const W = 300, H = 56;
  const line = (key, color) => {
    const pts = history.map((p, i) => p[key] == null ? null : [i / Math.max(1, history.length - 1) * W, H - 2 - p[key] / 100 * (H - 4)]).filter(Boolean);
    return pts.length > 1 ? `<polyline fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${pts.map((p) => p.join(",")).join(" ")}"/>` : "";
  };
  $("spark").innerHTML = line("cpu", "var(--accent)") + line("gpu", "var(--ok)");

  // gpu
  const g = h && h.gpu;
  const usingGpu = (j) => ((g && g.apps) || []).some((a) => { const o = ownerOf(byPid.get(a.pid) || { pid: a.pid, ppid: 0 }); return o && o.job_id === j.job_id; });
  const slotBlock = !cl ? "" : `<div style="margin-top:12px"><b>GPU slot ${cl.used_gpu_slots}/${cl.gpu_slots}</b></div>` +
    (gpuHolders.length
      ? `<table style="margin-top:4px"><tr><th>held by</th><th class="n">running</th><th>GPU</th></tr>${gpuHolders.map((j) => `<tr><td class="user">${esc(j.client_id)} · ${esc(j.project)}</td><td class="n">${fmtDur(now - j.started_ts)}</td><td>${usingGpu(j) ? "<b>in use</b>" : "<span class='muted'>idle: slot held, device not opened</span>"}</td></tr>`).join("")}</table>`
      : cl.used_gpu_slots ? `<div class="muted">held by ${esc(heldBy.join(", ") || "a job")} (the job is not in the latest 200 the scheduler lists)</div>` : `<div class="muted">free</div>`) +
    (gpuWaiting.length ? `<div style="margin-top:6px">${gpuWaiting.length} waiting: ${esc([...new Set(gpuWaiting.map((j) => `${j.client_id} · ${j.project}`))].join(", "))} <span class="muted">(oldest ${fmtDur(now - Math.min(...gpuWaiting.map((j) => j.created_ts)))})</span></div>` : "");
  const meter = (label, text, pct) => `<div style="margin-top:8px">${label} <b>${text}</b></div><div class="bar"><i style="width:${Math.min(100, Math.max(0, pct || 0))}%"></i></div>`;
  const gpuDeviceHtml = (d) => {
    const head = [d.temp_c != null ? `${d.temp_c}°C` : "", d.fan_pct != null ? `fan ${d.fan_pct}%` : "", d.pstate || ""].filter(Boolean).join(" · ");
    const mhz = (cur, max) => cur == null ? "–" : `${cur.toFixed(0)}${max ? ` / ${max.toFixed(0)}` : ""} MHz`;
    const info = [
      d.clock_gr_mhz != null ? `graphics ${mhz(d.clock_gr_mhz, d.clock_gr_max_mhz)}` : "",
      d.clock_mem_mhz != null ? `memory ${mhz(d.clock_mem_mhz, d.clock_mem_max_mhz)}` : "",
      d.pcie_gen != null ? `PCIe gen ${d.pcie_gen} x${d.pcie_width}${d.pcie_gen_max ? ` (max gen ${d.pcie_gen_max} x${d.pcie_width_max})` : ""}` : "",
      d.enc_util != null ? `encoder ${d.enc_util}% · decoder ${d.dec_util}%` : "",
      d.throttle && d.throttle.length ? `clocks limited by: ${d.throttle.join(", ")}` : "",
    ].filter(Boolean);
    return `<div><b>${esc(d.name)}</b> <span class="muted">· ${esc(head)}</span></div>` +
      meter("Compute", `${d.util}%`, d.util) + meter("Memory bandwidth", `${d.mem_util}%`, d.mem_util) +
      meter("VRAM", `${(d.mem_used_mb / 1024).toFixed(1)} / ${(d.mem_total_mb / 1024).toFixed(1)} GB`, 100 * d.mem_used_mb / d.mem_total_mb) +
      (d.power_w != null ? meter("Power", `${d.power_w.toFixed(0)} W${d.power_limit_w ? ` of ${d.power_limit_w.toFixed(0)} W limit` : ""}`, d.power_limit_w ? 100 * d.power_w / d.power_limit_w : 0) : "") +
      (info.length ? `<div class="muted" style="margin-top:8px;font-size:12px">${info.map(esc).join("<br>")}</div>` : "");
  };
  if (!g) $("gpu").innerHTML = `<span class="muted">no data</span>`;
  else if (!g.ok) $("gpu").innerHTML = (g.model ? `<div><b>${esc(g.model)}</b></div>` : "") + `<div class="gpu-off" style="margin-top:4px"><b>Utilisation unavailable</b></div><div class="muted" style="margin-top:6px">${esc(g.error || "nvidia-smi failed")}</div>` +
    `<div style="margin-top:10px"><b>Processes holding the GPU</b></div>` + ((g.apps || []).length ? `<table style="margin-top:4px"><tr><th>pid</th><th>process</th><th>job</th></tr>${g.apps.map((a) => { const o = ownerOf(byPid.get(a.pid) || { pid: a.pid, ppid: 0 }); return `<tr><td>${a.pid}</td><td class="cmd">${esc(a.name)}</td><td>${o ? esc(o.client_id + " · " + o.project) : "<b style='color:var(--bad)'>none</b>"}</td></tr>`; }).join("")}</table>` : `<div class="muted">none: the GPU is free</div>`) +
    slotBlock;
  else $("gpu").innerHTML = g.devices.map(gpuDeviceHtml).join("") +
    (g.apps.length ? `<table style="margin-top:10px"><tr><th>pid</th><th>process</th><th>job</th><th class="n">VRAM MB</th><th class="n">SM %</th><th class="n">mem %</th></tr>${g.apps.map((a) => { const o = ownerOf(byPid.get(a.pid) || { pid: a.pid, ppid: 0 }); const sys = !o && a.type === "G"; const v = (x) => x == null ? "–" : x; return `<tr><td>${a.pid}</td><td class="cmd">${esc(a.name)}</td><td>${o ? esc(o.client_id + " · " + o.project) : sys ? "<span class='muted'>display (system)</span>" : "<b style='color:var(--bad)'>none</b>"}</td><td class="n">${v(a.mem_mb)}</td><td class="n">${v(a.sm)}</td><td class="n">${v(a.mem_pct)}</td></tr>`; }).join("")}</table>` : `<div class="muted" style="margin-top:8px">no processes have the GPU open</div>`) + slotBlock;

  // disk space: size = used + free for jobs + kept back for root (ext4 reserves a few percent that ordinary users and jobs cannot write to)
  const size = (mb) => (mb >= 1048576 ? `${(mb / 1048576).toFixed(2)} TB` : `${(mb / 1024).toFixed(1)} GB`);
  const disks = ((h && h.disks) || []).filter((d) => d.total_mb >= 2048);                    // the 1 GB boot partition is not what fills up
  const lowest = disks.map((d) => ({ d, left: d.free_mb, pct: 100 * d.used_mb / Math.max(1, d.used_mb + d.free_mb) })).sort((a, b) => b.pct - a.pct)[0];
  $("diskNote").innerHTML = !lowest ? "" : `· <span style="${lowest.pct >= 90 ? "color:var(--bad);font-weight:600" : ""}">${esc(lowest.d.mount)} is ${lowest.pct.toFixed(0)}% full, ${size(lowest.left)} left for jobs</span>`;
  $("disks").innerHTML = `<tr><th>mount</th><th>disk</th><th>type</th><th class="n">size</th><th class="n">used</th><th class="n">free for jobs</th><th class="n">kept for root</th><th class="n">inodes free</th><th style="min-width:180px">used (of what jobs can use)</th></tr>` +
    (!(h && h.disks) ? `<tr><td colspan="9" class="muted">no disk data yet: the status service has not been updated</td></tr>` : disks.map((d) => {
      const pct = 100 * d.used_mb / Math.max(1, d.used_mb + d.free_mb), bad = pct >= 90, warn = pct >= 80;
      const colour = bad ? "var(--bad)" : warn ? "var(--warn)" : "var(--accent)";
      return `<tr><td class="user">${esc(d.mount)}</td><td>${esc(d.model || d.device)}<div class="muted" style="font-size:11px">${esc(d.device)}</div></td><td class="muted">${esc(d.fstype)}</td>` +
        `<td class="n">${size(d.total_mb)}</td><td class="n">${size(d.used_mb)}</td><td class="n"><b style="${bad ? "color:var(--bad)" : ""}">${size(d.free_mb)}</b></td><td class="n muted">${size(d.reserved_mb)}</td>` +
        `<td class="n">${d.inodes_total ? (100 * d.inodes_free / d.inodes_total).toFixed(0) + "%" : "–"}</td>` +
        `<td><b style="${bad ? "color:var(--bad)" : ""}">${pct.toFixed(0)}%</b>${bad ? ' <span class="muted">almost full</span>' : ""}<div class="bar"><i style="width:${pct}%;background:${colour}"></i></div></td></tr>`; }).join("") || `<tr><td colspan="9" class="muted">no disks reported</td></tr>`);

  // jobs
  const shown =[...running, ...queued, ...jobs.filter((j) => !running.includes(j) && !queued.includes(j)).slice(0, 8)];
  $("jobs").innerHTML = `<tr><th>user</th><th>status</th><th>project</th><th>engine</th><th class="n">CPU</th><th class="n">GPU</th><th class="n">elapsed</th></tr>` +
    (shown.map((j) => {
      const el = j.status === "running" ? now - j.started_ts : j.finished_ts && j.started_ts ? j.finished_ts - j.started_ts : 0;
      return `<tr><td class="user">${esc(j.client_id)}</td><td>${esc(j.status)}</td><td>${esc(j.project)}</td><td>${esc(j.engine)}</td><td class="n">${j.cpu_slots}</td><td class="n">${j.gpu_slots}</td><td class="n">${fmtDur(el)}</td></tr>`;
    }).join("") || `<tr><td colspan="7" class="muted">no jobs</td></tr>`);

  // per-user
  const users = {};
  for (const j of running) { const u = users[j.client_id] ||= { jobs: 0, cpu: 0, gpu: 0, q: 0 }; u.jobs++; u.cpu += j.cpu_slots; u.gpu += j.gpu_slots; }
  for (const j of queued) { (users[j.client_id] ||= { jobs: 0, cpu: 0, gpu: 0, q: 0 }).q++; }
  const procCpu = {};
  for (const p of (h && h.procs) || []) { const o = ownerOf(p); const u = o ? o.client_id : p.user; procCpu[u] = (procCpu[u] || 0) + p.cpu; }
  const names = [...new Set([...Object.keys(users), ...Object.keys(procCpu).filter((u) => procCpu[u] >= 5)])];
  $("users").innerHTML = `<tr><th>user</th><th class="n">jobs</th><th class="n">queued</th><th class="n">CPU slots</th><th class="n">GPU</th><th class="n">live CPU (cores)</th></tr>` +
    (names.map((u) => { const r = users[u] || { jobs: 0, cpu: 0, gpu: 0, q: 0 }; return `<tr><td class="user">${esc(u)}</td><td class="n">${r.jobs}</td><td class="n">${r.q}</td><td class="n">${r.cpu}</td><td class="n">${r.gpu}</td><td class="n">${((procCpu[u] || 0) / 100).toFixed(2)}</td></tr>`; }).join("") || `<tr><td colspan="6" class="muted">idle</td></tr>`);

  // processes
  const hideIdle = $("hideIdle").checked, hideKernel = $("hideKernel").checked;
  let rows = ((h && h.procs) || []).map((p) => ({ ...p, owner: ownerOf(p) }));
  rows = rows.filter((p) => !(hideIdle && p.cpu < 0.5) && !(hideKernel && /^(\[|kworker|kthreadd|irq\/|rcu_|ksoftirq|migration|cpuhp|jbd2|kswapd|kcompactd)/.test(p.cmd)));
  const val = (p) => sortKey === "who" ? (p.owner ? p.owner.client_id : p.user) : p[sortKey];
  rows.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sortDir);
  const th = (k, l, cls = "") => `<th class="${cls}" data-k="${k}">${l}${sortKey === k ? (sortDir < 0 ? " ▾" : " ▴") : ""}</th>`;
  $("procs").innerHTML = `<tr>${th("who", "who")}${th("user", "OS user")}${th("pid", "pid", "n")}${th("cpu", "CPU %", "n")}${th("mem", "MEM %", "n")}${th("etimes", "running", "n")}<th>command</th></tr>` +
    (rows.slice(0, 80).map((p) => `<tr><td class="user">${esc(p.owner ? p.owner.client_id : p.user)}</td><td class="muted">${esc(p.user)}</td><td class="n">${p.pid}</td><td class="n">${p.cpu.toFixed(1)}</td><td class="n">${p.mem.toFixed(1)}</td><td class="n">${fmtDur(p.etimes)}</td><td class="cmd">${esc(p.cmd)}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">nothing to show</td></tr>`);

  ctx = { now, snap, jobs, running, queued, h, cl, g, ownerOf, byPid, onCore };
  if (openKind) paintDetail();                                  // keep an open window live
}

// ---------------------------------------------------------------- "what uses it": click a tile to see every user of that resource
let ctx = null, openKind = null, lastModal = "", onCore = {};
const DETAIL_TITLES = { power: "CPU power: how to keep it after a reboot", cores: "CPU cores: what runs on each core", cpu: "CPU: everything using it", gpu: "GPU: everything using it", memory: "Memory: system, jobs and free" };
const gb = (mb) => (mb / 1024).toFixed(1);
const who = (j) => `${esc(j.client_id)} · ${esc(j.project)}`;
const short = (s, n = 100) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
const td = (v, c) => `<td${c ? ` class="${c}"` : ""}>${v}</td>`;
const tbl = (head, rows, empty) => `<div class="scroll" style="max-height:none"><table><tr>${head.map(([l, c]) => `<th class="${c || ""}" style="cursor:default">${l}</th>`).join("")}</tr>` +
  `${rows.join("") || `<tr><td colspan="${head.length}" class="muted">${empty || "none"}</td></tr>`}</table></div>`;

// CPU, RAM and process count per job (its whole process tree), and per OS user for the processes outside every listed job
function usageOf(c) {
  const per = new Map(), other = new Map();
  for (const p of (c.h && c.h.procs) || []) {
    const o = c.ownerOf(p), m = o ? per : other, key = o ? o.job_id : p.user;
    let b = m.get(key);
    if (!b) { b = { job: o, user: p.user, cores: 0, rss: 0, n: 0, procs: [] }; m.set(key, b); }
    b.cores += p.cpu / 100; b.rss += p.rss_mb; b.n++; b.procs.push(p);
  }
  return { per, other: [...other.values()] };
}

function detailHtml(kind) {
  const { now, jobs, running, queued, h, cl, g, ownerOf, byPid } = ctx;

  if (kind === "power") {
    const cp = h && h.cpu_power;
    if (!cp) return `<p class="muted">no host data yet</p>`;
    const CMD = `echo 'ACTION=="add", SUBSYSTEM=="powercap", KERNEL=="intel-rapl:0", RUN+="/bin/chmod a+r /sys%p/energy_uj"' | sudo tee /etc/udev/rules.d/99-rapl-readable.rules && ` +
      `sudo udevadm control --reload && sudo udevadm trigger --subsystem-match=powercap --action=add && cat /sys/class/powercap/intel-rapl:0/energy_uj`;
    const boot = h.boot_ts ? `The machine last started ${fmtAge(now - h.boot_ts)} ago (${esc(new Date(h.boot_ts * 1000).toLocaleString())}). ` : "";
    const state = cp.watts != null
      ? `<p><b>${cp.watts.toFixed(0)} W</b> right now, from the CPU package energy counter. ${boot}</p>` +
        (cp.persistent === false ? `<p class="warn">The counter is readable only because someone ran a one-off chmod. A reboot undoes that and this tile goes back to "unavailable". Install the boot-time rule below to keep it.</p>`
          : `<p>A boot-time rule is installed, so the counter stays readable after every reboot.</p>`)
      : `<p class="warn">Unavailable: ${esc(cp.reason)}.</p><p>${boot}A chmod done by hand does not survive a reboot, which is why this came back.</p>`;
    const fix = cp.persistent === true ? "" : `<h3>One-time fix, on the ASTRUM machine (needs sudo)</h3>` +
      `<p>Open a terminal on the machine as a user with sudo and paste this single line. It installs a rule that opens the counter every time the machine boots:</p>` +
      `<pre id="rplCmd">${esc(CMD)}</pre><p><button type="button" class="pill" data-copy="rplCmd">Copy command</button></p>` +
      `<p class="muted">It prints a number when it worked. The tile fills in at the next refresh (within 5 minutes) with no change to the dashboard, and this window then says the rule is installed. ` +
      `The same steps are in admin/README.md.</p>`;
    return state + fix + `<h3>What it changes</h3><p class="muted">Every user on that machine can then read the CPU's power draw. Linux restricts the counter because power readings can leak information about what other users run on the CPU (a side channel called PLATYPUS); on a machine whose users are trusted that is usually acceptable. To undo it, delete /etc/udev/rules.d/99-rapl-readable.rules and run <code>sudo chmod o-r /sys/class/powercap/intel-rapl:0/energy_uj</code>.</p>`;
  }

  if (!cl) return `<p class="muted">no scheduler data yet</p>`;
  const u = usageOf(ctx);
  const use = (j) => u.per.get(j.job_id) || { cores: 0, rss: 0, n: 0, procs: [] };
  const unlisted = cl.running_jobs > running.length ? `<p class="warn">The scheduler counts ${cl.running_jobs} running jobs but only ${running.length} are listed here.</p>` : "";
  const byDesc = (key) => [...running].sort((a, b) => key(b) - key(a));
  const queueTable = () => tbl([["who"], ["job"], ["CPU", "n"], ["GPU", "n"], ["memory", "n"], ["waiting", "n"]],
    queued.map((j) => `<tr>${td(`<b>${who(j)}</b>`)}${td(j.job_id.slice(-6))}${td(j.cpu_slots, "n")}${td(j.gpu_slots, "n")}${td(j.memory_mb ? gb(j.memory_mb) + " GB" : "–", "n")}${td(fmtDur(now - j.created_ts), "n")}</tr>`), "nothing is waiting");

  if (kind === "cpu") {
    const avg = h ? h.cores.reduce((s, c) => s + c.busy, 0) / h.cores.length : 0, busy = h ? h.cores.filter((c) => c.busy >= 50).length : 0;
    const rows = byDesc((j) => j.cpu_slots).map((j) => { const x = use(j);
      return `<tr>${td(`<b>${who(j)}</b>`)}${td(j.job_id.slice(-6))}${td(j.cpu_slots, "n")}${td(x.cores.toFixed(2), "n")}${td(j.cpu_slots ? (100 * x.cores / j.cpu_slots).toFixed(0) + "%" : "", "n")}${td(gb(x.rss) + " GB", "n")}${td(fmtDur(now - j.started_ts), "n")}</tr>`; });
    const slots = running.reduce((s, j) => s + j.cpu_slots, 0), cores = running.reduce((s, j) => s + use(j).cores, 0);
    if (rows.length) rows.push(`<tr class="total">${td("total")}${td("")}${td(slots, "n")}${td(cores.toFixed(2), "n")}${td(slots ? (100 * cores / slots).toFixed(0) + "%" : "", "n")}${td("")}${td("")}</tr>`);
    const others = u.other.filter((o) => o.cores >= 0.03).sort((a, b) => b.cores - a.cores).map((o) => { const top = o.procs.slice().sort((a, b) => b.cpu - a.cpu)[0];
      return `<tr>${td(`<b>${esc(o.user)}</b>`)}${td(o.n, "n")}${td(o.cores.toFixed(2), "n")}${td(gb(o.rss) + " GB", "n")}${td(esc(short(top.cmd, 110)), "cmd")}</tr>`; });
    return `<p>Scheduler: <b>${cl.used_cpu_slots} of ${cl.cpu_slots}</b> CPU slots reserved, ${cl.available_cpu_slots} free (${cl.cpu_reserve} of the host's ${cl.logical_cpus} logical CPUs are kept back for the system).` +
      (h ? ` Actually busy now: <b>${avg.toFixed(0)}%</b> on average, ${busy} of ${h.cores.length} cores above 50%.` : "") + `</p>` + unlisted +
      `<p class="muted">A slot is a reservation. "Cores busy now" is what the job's processes really use, so a low "of reservation" means the job holds slots it is not using.</p>` +
      `<h3>Jobs holding CPU slots</h3>` + tbl([["who"], ["job"], ["slots", "n"], ["cores busy now", "n"], ["of reservation", "n"], ["RAM", "n"], ["running", "n"]], rows, "no running jobs") +
      `<h3>Waiting for CPU slots</h3>` + queueTable() +
      `<h3>CPU used outside any listed job (by OS user)</h3>` + tbl([["OS user"], ["processes", "n"], ["cores busy now", "n"], ["RAM", "n"], ["busiest process"]], others, "nothing significant");
  }

  if (kind === "cores") {
    if (!h) return `<p class="muted">no host data yet</p>`;
    const n = h.cores.length, work = h.cores.reduce((s, c) => s + c.busy, 0) / 100, busy = h.cores.filter((c) => c.busy >= 50).length;
    const active = h.cores.filter((c) => c.busy >= 1).sort((a, b) => b.busy - a.busy);
    const rows = active.map((c) => { const on = (ctx.onCore[c.id] || []).slice().sort((a, b) => b.pct - a.pct);
      const by = on.length ? on.map((t) => `<b>${esc(t.who)}</b> · pid ${t.pid} · ${t.pct.toFixed(0)}%<br><span class="muted">${esc(short(t.cmd, 100))}</span>`).join("<br>") : "<span class='muted'>kernel work or short-lived processes</span>";
      return `<tr>${td(c.id)}${td(c.busy.toFixed(0) + "%", "n")}${td(`user ${c.user}% · nice ${c.nice}% · sys ${c.sys}% · iowait ${c.iowait}%`)}${td(by, "cmd")}</tr>`; });
    return `<p><b>${busy}</b> of ${n} cores are above 50%. Together the cores do <b>${work.toFixed(2)}</b> cores of work, ${(100 * work / n).toFixed(1)}% of the host, from a 1 s sample.` +
      ` ${n - active.length} cores are idle (below 1%).</p>` + unlisted +
      `<p class="muted">The scheduler has reserved ${cl.used_cpu_slots} of ${cl.cpu_slots} CPU slots; click the CPU slots tile to compare each job's reservation with what it really uses. ` +
      `Scheduled jobs run at low priority, so their time shows as "nice". Only threads using at least 2% of a core are attributed to a job.</p>` +
      `<h3>Cores in use</h3>` + tbl([["core"], ["busy", "n"], ["time split"], ["what runs on it"]], rows, "every core is idle");
  }

  if (kind === "gpu") {
    const apps = (g && g.apps) || [], d = g && g.ok && g.devices[0];
    const appJob = (a) => ownerOf(byPid.get(a.pid) || { pid: a.pid, ppid: 0 });
    const holders = running.filter((j) => j.gpu_slots > 0).map((j) => {
      const mine = apps.filter((a) => (appJob(a) || {}).job_id === j.job_id), mb = mine.reduce((s, a) => s + (typeof a.mem_mb === "number" ? a.mem_mb : 0), 0);
      return `<tr>${td(`<b>${who(j)}</b>`)}${td(j.job_id.slice(-6))}${td(j.gpu_slots, "n")}${td(j.cpu_slots, "n")}${td(mine.length ? "<b>in use</b>" : "<span class='muted'>idle: slot held, device not opened</span>")}${td(mine.length ? mb : "–", "n")}${td(fmtDur(now - j.started_ts), "n")}</tr>`; });
    const procs = apps.map((a) => { const o = appJob(a), sys = !o && a.type === "G", v = (x) => (x == null ? "–" : x);
      return `<tr>${td(a.pid)}${td(esc(short(a.name, 90)), "cmd")}${td(o ? who(o) : sys ? "<span class='muted'>display (system)</span>" : "<b class='warn'>no job</b>")}${td(v(a.mem_mb), "n")}${td(v(a.sm), "n")}${td(v(a.mem_pct), "n")}</tr>`; });
    const acc = apps.reduce((s, a) => s + (typeof a.mem_mb === "number" ? a.mem_mb : 0), 0);
    return `<p>Scheduler: <b>${cl.used_gpu_slots} of ${cl.gpu_slots}</b> GPU slot${cl.gpu_slots === 1 ? "" : "s"} in use. ` +
      (d ? `${esc(d.name)}: compute <b>${d.util}%</b>, VRAM <b>${gb(d.mem_used_mb)} / ${gb(d.mem_total_mb)} GB</b>${d.power_w != null ? `, <b>${d.power_w.toFixed(0)} W</b>` : ""}, ${d.temp_c}°C.` : `GPU readings unavailable${g && g.error ? ": " + esc(g.error) : ""}.`) + `</p>` + unlisted +
      `<h3>Jobs holding the GPU slot</h3>` + tbl([["who"], ["job"], ["GPU slots", "n"], ["CPU slots", "n"], ["GPU"], ["VRAM MB", "n"], ["running", "n"]], holders, "the GPU slot is free") +
      `<h3>Waiting for the GPU slot</h3>` + tbl([["who"], ["job"], ["CPU", "n"], ["GPU", "n"], ["memory", "n"], ["waiting", "n"]],
        queued.filter((j) => j.gpu_slots > 0).map((j) => `<tr>${td(`<b>${who(j)}</b>`)}${td(j.job_id.slice(-6))}${td(j.cpu_slots, "n")}${td(j.gpu_slots, "n")}${td(j.memory_mb ? gb(j.memory_mb) + " GB" : "–", "n")}${td(fmtDur(now - j.created_ts), "n")}</tr>`), "nothing is waiting for the GPU") +
      `<h3>Processes with the GPU open</h3>` + tbl([["pid"], ["process"], ["job"], ["VRAM MB", "n"], ["SM %", "n"], ["mem %", "n"]], procs, "none") +
      (d ? `<p class="muted">These processes account for ${acc} MB of the ${d.mem_used_mb.toFixed(0)} MB in use; the rest is memory the driver reserves.</p>` : "");
  }

  if (kind === "memory") {
    if (!h) return `<p class="muted">no host data yet</p>`;
    const m = memBreakdown(h, ownerOf), pc = (x) => (100 * x / m.total).toFixed(0) + "%";
    const seg = (mb, color) => `<i style="width:${100 * mb / m.total}%;background:${color}"></i>`;
    const dot = (color) => `<i class="dot" style="background:${color}"></i>`;
    const gap = cl.available_memory_mb - m.free;
    const reservedTotal = running.reduce((s, j) => s + (j.memory_mb || 0), 0);
    const jobRows = byDesc((j) => use(j).rss).map((j) => { const x = use(j), res = j.memory_mb || 0;
      const note = !res ? "<span class='warn'>nothing reserved: the scheduler does not count this job's memory</span>" : x.rss > res ? `<span class='warn'>uses ${gb(x.rss - res)} GB more than reserved</span>` : "within its reservation";
      return `<tr>${td(`<b>${who(j)}</b>`)}${td(j.job_id.slice(-6))}${td(res ? gb(res) + " GB" : "<span class='muted'>none</span>", "n")}${td(gb(x.rss) + " GB", "n")}${td(note)}${td(fmtDur(now - j.started_ts), "n")}</tr>`; });
    if (jobRows.length) jobRows.push(`<tr class="total">${td("total")}${td("")}${td(gb(reservedTotal) + " GB", "n")}${td(gb(running.reduce((s, j) => s + use(j).rss, 0)) + " GB", "n")}${td("")}${td("")}</tr>`);
    const sysRows = u.other.slice().sort((a, b) => b.rss - a.rss).filter((o) => o.rss >= 20).map((o) => { const top = o.procs.slice().sort((a, b) => b.rss_mb - a.rss_mb)[0];
      return `<tr>${td(`<b>${esc(o.user)}</b>`)}${td(o.n, "n")}${td(gb(o.rss) + " GB", "n")}${td(esc(short(top.cmd, 100)), "cmd")}</tr>`; });
    const sysListed = u.other.reduce((s, o) => s + o.rss, 0);
    const top = (h.procs || []).slice().sort((a, b) => b.rss_mb - a.rss_mb).slice(0, 12).map((p) => { const o = ownerOf(p);
      return `<tr>${td(o ? `<b>${who(o)}</b>` : `${esc(p.user)} <span class="muted">(system)</span>`)}${td(p.pid, "n")}${td(gb(p.rss_mb) + " GB", "n")}${td(fmtDur(p.etimes), "n")}${td(esc(short(p.cmd, 100)), "cmd")}</tr>`; });
    return `<div class="stack" style="height:16px">${seg(m.hw, "var(--text)")}${seg(m.os, "var(--muted)")}${seg(m.jobs, "var(--accent)")}${seg(m.free, "var(--c1)")}</div>` +
      `<p>${dot("var(--muted)")}<b>System &amp; other ${gb(m.sys)} GB</b> (${pc(m.sys)}) · ${dot("var(--accent)")}<b>Jobs ${gb(m.jobs)} GB</b> (${pc(m.jobs)}) · ${dot("var(--c1)")}<b>Free ${gb(m.free)} GB</b> (${pc(m.free)}) · of ${gb(m.total)} GB installed</p>` + unlisted +
      `<h3>Jobs: ${gb(m.jobs)} GB in use, ${gb(reservedTotal)} GB reserved with the scheduler</h3>` +
      `<p class="muted">A reservation is what a job asked the scheduler for; "using now" is what its processes really hold. The scheduler plans with the reservation, the host runs out of the real figure.</p>` +
      tbl([["who"], ["job"], ["reserved", "n"], ["using now", "n"], ["status"], ["running", "n"]], jobRows, "no running jobs") +
      `<h3>System &amp; other: ${gb(m.sys)} GB</h3>` +
      `<p>${dot("var(--text)")}<b>${gb(m.hw)} GB reserved before the OS starts</b>: the firmware (including the integrated graphics' carve-out) and the kernel's own tables. The OS sees ${gb(h.mem_total_mb)} GB of the ${gb(m.total)} GB installed.<br>` +
      `${dot("var(--muted)")}<b>${gb(m.os)} GB used by the OS and services</b>: ${gb(sysListed)} GB in the processes below, the rest is the kernel and caches. The scheduler keeps ${gb(cl.memory_reserve_mb)} GB back for this` +
      `${m.os > cl.memory_reserve_mb ? ` <span class="warn">and it uses more than that</span>` : ", and it uses less"}.</p>` +
      tbl([["OS user"], ["processes", "n"], ["RAM", "n"], ["biggest process"]], sysRows, "nothing significant") +
      `<h3>Free: ${gb(m.free)} GB</h3>` +
      `<p>The host really has <b>${gb(m.free)} GB</b> available. The scheduler believes <b>${gb(cl.available_memory_mb)} GB</b> is free (${gb(cl.memory_slots_mb)} GB schedulable minus ${gb(cl.used_memory_mb)} GB reserved)` +
      `${gap > 512 ? `. <span class="warn">That is ${gb(gap)} GB more than there is: a job asking for more than ${gb(m.free)} GB is still admitted, takes its slots, and then waits for memory.</span>` : "."}</p>` +
      `<h3>Waiting jobs and the memory they ask for</h3>` + queueTable() +
      `<h3>Biggest processes</h3>` + tbl([["owner"], ["pid", "n"], ["RAM", "n"], ["running", "n"], ["command"]], top, "none") +
      `<p class="muted">Memory is each process's resident size. Processes of one job that share pages are counted in full each time${m.overcounted ? ", which here makes the jobs add up to more than is in use, so the jobs figure is capped" : ""}.</p>`;
  }

  return "";
}

function paintDetail() {
  if (!openKind || !ctx) return;
  $("modalTitle").textContent = DETAIL_TITLES[openKind] || "";
  const html = detailHtml(openKind);
  if (html !== lastModal) { $("modalBody").innerHTML = html; lastModal = html; }
}
function openDetail(kind) { openKind = kind; lastModal = ""; $("modalBg").hidden = false; paintDetail(); }
function closeDetail() { openKind = null; $("modalBg").hidden = true; }
document.addEventListener("click", (e) => { const t = e.target.closest("[data-detail]"); if (t) openDetail(t.dataset.detail); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDetail();
  else if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-detail]")) { e.preventDefault(); openDetail(e.target.dataset.detail); }
});
document.addEventListener("click", (e) => {                       // "Copy command" buttons
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const el = $(b.dataset.copy), txt = el.textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
    () => { b.textContent = "Copied ✓"; },
    () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected: press Ctrl+C"; });
});
$("modalClose").addEventListener("click", closeDetail);
$("modalBg").addEventListener("click", (e) => { if (e.target === $("modalBg")) closeDetail(); });

let last = null;
async function tick() {
  try { last = await (await fetch("/api/snapshot", { cache: "no-store" })).json(); render(last); }
  catch { $("fresh").textContent = "dashboard server unreachable"; $("fresh").className = "pill bad"; }
}
document.addEventListener("click", (e) => {
  const k = e.target.closest("th[data-k]")?.dataset.k;
  if (!k) return;
  sortDir = sortKey === k ? -sortDir : (k === "cpu" || k === "mem" || k === "etimes" ? -1 : 1); sortKey = k;
  if (last) render(last);
});
$("refreshNow").addEventListener("click", async () => {
  const b = $("refreshNow"); b.disabled = true; b.textContent = "Refreshing…";
  try { await fetch("/api/refresh", { method: "POST" }); } catch { /* the tick shows the error */ }
  setTimeout(() => { b.disabled = false; b.textContent = "Refresh now"; }, 8000);
});
["hideIdle", "hideKernel"].forEach((id) => $(id).addEventListener("change", () => last && render(last)));
tick(); setInterval(tick, 2000);
</script>
